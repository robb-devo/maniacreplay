plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"streamerreplay" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integration, only loaded when Mod Menu is installed.
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	runs {
		client {
			vmArgs "-Xmx2G"
		}
	}
}

// Automated in-game tests (record -> replay -> export), run with ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "streamerreplay-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		// Shader-pack and crash-recovery runs manage their own run directory (see below).
		clearRunDirectory = !project.hasProperty("shaderPack") && !project.hasProperty("crashPhase")
	}
}

// Compatibility run: ./gradlew runClientGameTest -PcompatMods=/path/a.jar,/path/b.jar
// Loads extra mods (e.g. Sodium, Iris, Lithium, Mod Menu) into the end-to-end client test.
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	if (project.hasProperty("compatMods")) {
		jvmArgs("-Dfabric.addMods=" + project.property("compatMods").toString().replace(",", File.pathSeparator))
	}
}

// German UI run: ./gradlew runClientGameTest -PgametestLang=de_de
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	if (project.hasProperty("gametestLang")) {
		jvmArgs("-Dstreamerreplay.gametest.lang=" + project.property("gametestLang"))
	}
	// extra test switches: -PgametestProps=streamerreplay.gametest.x=true,other=1
	if (project.hasProperty("gametestProps")) {
		project.property("gametestProps").toString().split(",").each { jvmArgs("-D" + it) }
	}
}

// Iris run: ./gradlew runClientGameTest -PcompatMods=...iris.jar,...sodium.jar -PshaderPack=/path/pack.zip
// Starts from an empty run directory with the pack installed and enabled.
if (project.hasProperty("shaderPack")) {
	def runDir = layout.projectDirectory.dir("build/run/clientGameTest").asFile
	def pack = file(project.property("shaderPack").toString())
	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		doFirst {
			runDir.deleteDir()
			new File(runDir, "shaderpacks").mkdirs()
			new File(runDir, "config").mkdirs()
			java.nio.file.Files.copy(pack.toPath(), new File(runDir, "shaderpacks/" + pack.name).toPath())
			new File(runDir, "config/iris.properties").text = "enableShaders=true\nshaderPack=" + pack.name + "\n"
			new File(runDir, "eula.txt").text = "eula=true\n"
		}
	}
}

// Crash-recovery test (scripts/crash-recovery-test.sh): phase "crash" records in a fresh run directory until the
// script kills the JVM with SIGKILL; phase "recover" starts again on the same directory and checks the recovery.
if (project.hasProperty("crashPhase")) {
	def runDir = layout.projectDirectory.dir("build/run/clientGameTest").asFile
	def phase = project.property("crashPhase").toString()
	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		jvmArgs("-Dstreamerreplay.gametest.mode=" + phase)
		if (phase == "crash") {
			doFirst {
				runDir.deleteDir()
				runDir.mkdirs()
				new File(runDir, "eula.txt").text = "eula=true\n"
			}
		}
	}
}
